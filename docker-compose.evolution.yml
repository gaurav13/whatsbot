# Local Evolution API v2 + Postgres + Redis.
# Does not replace the SaaS Express DATABASE_URL.
#
#   cp .env.evolution.example .env.evolution
#   docker compose -f docker-compose.evolution.yml --env-file .env.evolution up -d
#   curl http://127.0.0.1:8080
#
# Manager UI: http://localhost:8080/manager
# API key header: apikey: <AUTHENTICATION_API_KEY>

name: gsai-evolution

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: gsai-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.evolution
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: ${AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES:-true}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${DATABASE_CONNECTION_URI}
      DATABASE_CONNECTION_CLIENT_NAME: ${DATABASE_CONNECTION_CLIENT_NAME:-evolution_v2}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: ${CACHE_REDIS_URI:-redis://evolution-redis:6379/1}
      CACHE_REDIS_PREFIX_KEY: ${CACHE_REDIS_PREFIX_KEY:-evolution}
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: ${WEBHOOK_GLOBAL_ENABLED:-true}
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_GLOBAL_URL:-http://host.docker.internal:3000/webhooks/evolution}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: ${WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS:-false}
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_LOGOUT_INSTANCE: "true"
      QRCODE_LIMIT: ${QRCODE_LIMIT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      LOG_BAILEYS: ${LOG_BAILEYS:-error}
      DEL_INSTANCE: ${DEL_INSTANCE:-false}
      LANGUAGE: ${LANGUAGE:-en}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    networks:
      - evolution

  evolution-postgres:
    image: postgres:16-alpine
    container_name: gsai-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evo_local_pg_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolution} -d ${POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - evolution

  evolution-redis:
    image: redis:7-alpine
    container_name: gsai-evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - evolution

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution:
    name: gsai-evolution
